name: Verify
on:
  push:
    branches: [main]
  pull_request:
    branches: [main, eval/feedback-development-v1]
  workflow_dispatch:
    inputs:
      mode:
        description: Model-free merge checkpoint
        type: choice
        default: full
        options: [full]
permissions:
  contents: read
concurrency:
  group: verify-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  native:
    name: Native product and model-free evaluation
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: npm ci --ignore-scripts --prefix profiles/native/sensitivity
      - run: npm run verify
      - name: Install pinned OpenCode without lifecycle scripts
        run: npm install --ignore-scripts --no-audit --no-fund --prefix "$RUNNER_TEMP/opencode" opencode-linux-x64@1.18.26
      - name: Actual installed local-provider checks
        env:
          OPENCODE_BIN: ${{ runner.temp }}/opencode/node_modules/opencode-linux-x64/bin/opencode
        run: npm run verify:installed
      - name: Installed task delivery with large Git inventory
        env:
          OPENCODE_BIN: ${{ runner.temp }}/opencode/node_modules/opencode-linux-x64/bin/opencode
          NATIVE_TASK_FIXTURE_LARGE_GIT: '1'
          NATIVE_TASK_FIXTURE_DIRECT: '1'
          NATIVE_TASK_FIXTURE_MODES: missing-read
        run: node scripts/verify-native-task-fixture.mjs
  containment:
    name: Evaluation container boundary
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - run: npm install --ignore-scripts --no-audit --no-fund --prefix "$RUNNER_TEMP/opencode" opencode-linux-arm64@1.18.26
      - name: Build owned container fixture image
        run: docker build --iidfile "$RUNNER_TEMP/evaluation-image" -f evaluation/support/Dockerfile evaluation/support
      - name: Verify real isolation, descendant stop and private capture
        env:
          OPENCODE_LINUX_BIN: ${{ runner.temp }}/opencode/node_modules/opencode-linux-arm64/bin/opencode
        run: EVALUATION_IMAGE="$(cat "$RUNNER_TEMP/evaluation-image")" node evaluation/support/verify-output-boundaries.mjs
      - name: Large input manifest, completeness and cancellation
        run: EVALUATION_IMAGE="$(cat "$RUNNER_TEMP/evaluation-image")" node evaluation/support/verify-large-input.mjs
      - name: Feedback development scripted native delivery and independent scoring
        env:
          OPENCODE_LINUX_BIN: ${{ runner.temp }}/opencode/node_modules/opencode-linux-arm64/bin/opencode
        run: |
          export EVALUATION_IMAGE="$(cat "$RUNNER_TEMP/evaluation-image")"
          node evaluation/feedback-development/assets.mjs "$RUNNER_TEMP/feedback-assets" "$OPENCODE_LINUX_BIN"
          node evaluation/feedback-development/preflight.mjs "$RUNNER_TEMP/feedback-preflight" --contained --toolchain "$RUNNER_TEMP/feedback-assets/toolchain"
          node evaluation/feedback-development/installed.mjs "$RUNNER_TEMP/feedback-fixture" "$RUNNER_TEMP/feedback-assets/bundle" "$RUNNER_TEMP/feedback-assets/toolchain"
      - name: Remove owned feedback fixture files
        if: always()
        run: rm -rf "$RUNNER_TEMP/feedback-assets" "$RUNNER_TEMP/feedback-preflight" "$RUNNER_TEMP/feedback-fixture" "$RUNNER_TEMP/feedback-fixture-deadline"
      - name: Remove owned fixture image
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/evaluation-image"; then
            docker image rm "$(cat "$RUNNER_TEMP/evaluation-image")"
          fi
  required-status:
    name: Harness verification
    if: always()
    needs: [native, containment]
    runs-on: ubuntu-latest
    steps:
      - name: Require actually executed checks
        env:
          NATIVE: ${{ needs.native.result }}
          CONTAINMENT: ${{ needs.containment.result }}
        run: test "$NATIVE" = success && test "$CONTAINMENT" = success
